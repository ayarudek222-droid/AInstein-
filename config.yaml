# AInstein configuration
# Tracks are domains. Every source declares what may be done with it
# (see SOURCES.md). The directory lists what is CURRENTLY active —
# retired, paused and not-yet-built entries are deliberately absent.

tracks:
- id: ai
  label: AI
  blurb: The labs, the models, and the papers underneath the announcements.
  match:
    categories:
    - cs.AI
    - cs.LG
    - cs.CL
    - cs.CV
    - cs.NE
    - stat.ML
    keywords:
    - language model
    - neural network
    - transformer
    - benchmark
    - fine-tun
    - reinforcement learning
    - alignment
    - inference
    - training run
    - agent
    - llm
    - llms
    - gpt
    - gemini
    - claude
    - mistral
    - agents
    - chatbot
    - openai
    - deepmind
    - anthropic
    - machine learning
- id: astro
  label: Astrophysics
  blurb: The observatories and deep-space missions, and what they are actually finding.
  match:
    categories:
    - astro-ph
    - physics.space-ph
    - gr-qc
    keywords:
    - telescope
    - exoplanet
    - galaxy
    - cosmic
    - planetary
    - black hole
    - nebula
    - solar wind
    - heliosphere
    - astronomer
    - observatory
    - rover
    - flyby
    - lunar surface
    - martian
    - comet
    - supernova
    - betelgeuse
    - milky way
    - star
    - planet
    - moon
- id: industry
  label: Space industry
  blurb: Launchers, satellites and the companies flying them — who raised, who launched, who won the contract.
  match:
    categories: []
    keywords:
    - launch vehicle
    - launcher
    - rocket
    - spaceport
    - constellation
    - smallsat
    - satellite operator
    - ground station
    - earth observation
    - propulsion
    - in-orbit
    - debris removal
    - contract
    - funding round
    - commercial crew
    - payload capacity
    - first flight
    - starship
    - spacex
    - launch
    - satellite
- id: particles
  label: Particle physics
  blurb: The detectors, where they sit underground, and what they measured.
  match:
    categories:
    - hep-ex
    - hep-ph
    - hep-lat
    keywords:
    - collider
    - quark
    - neutrino
    - boson
    - muon
    - kaon
    - antimatter
    - dark matter
    - lhc
    - standard model
    - decay channel
    - higgs
    - cern
- id: energy
  label: Energy
  blurb: The physics and engineering of making power — fusion, fission, storage, sun and heat.
  match:
    categories:
    - physics.plasm-ph
    - physics.app-ph
    keywords:
    - fusion
    - fission
    - tokamak
    - stellarator
    - reactor
    - battery
    - lithium
    - solar cell
    - photovoltaic
    - perovskite
    - energy storage
    - grid
    - geothermal
    - hydrogen
    - electrolyzer
    - ignition
    - power plant
    - nuclear power
    - solar
    - wind power
- id: biotech
  label: Biotech
  blurb: mRNA, gene editing and protein design — where lab results turn into treatments.
  match:
    categories:
    - q-bio.BM
    - q-bio.GN
    - q-bio.MN
    - q-bio.QM
    keywords:
    - mrna
    - crispr
    - gene editing
    - gene therapy
    - vaccine
    - antibody
    - clinical trial
    - protein design
    - protein structure
    - cell therapy
    - genome
    - sequencing
    - base editing
    - stem cell
    - embryo
    - progenitor
    - cancer
    - drug
    - dna
    - genetic
- id: opportunities
  label: Opportunities
  blurb: Competitions, calls and deadlines worth a calendar entry.
  match: {}
limits:
  per_track: 40
  per_source: 8
interests:
  first detection: 4
  first measurement: 4
  launch: 3
  neutrino: 3
  dark matter: 3
  gravitational wave: 3
  exoplanet: 3
  interstellar: 3
  jwst: 3
